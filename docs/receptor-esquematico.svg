<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Esquema de ligação do receptor</title>
<desc>ESP32 ligado ao módulo LoRa E32 por sete fios, e uma pilha de 9 V alimentando o pino VIN do ESP32.</desc>
<rect width="680" height="500" fill="#ffffff"/>

<line x1="555" y1="38" x2="555" y2="70" stroke="#2c2c2a" stroke-width="1.5"/>
<circle cx="555" cy="36" r="3" fill="#2c2c2a"/>
<text x="568" y="40" font-size="12" fill="#444441">Antena (ligar antes)</text>

<rect x="150" y="70" width="150" height="360" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
<text x="225" y="92" font-size="14" font-weight="bold" fill="#2c2c2a" text-anchor="middle">ESP32</text>
<text x="225" y="110" font-size="12" fill="#5f5e5a" text-anchor="middle">Receptor da base</text>

<rect x="480" y="70" width="150" height="360" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="555" y="92" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">LoRa E32</text>
<text x="555" y="110" font-size="12" fill="#0f6e56" text-anchor="middle">Rádio</text>

<rect x="20" y="325" width="80" height="90" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="52" y="342" font-size="14" font-weight="bold" fill="#633806" text-anchor="middle">Pilha</text>
<text x="52" y="400" font-size="12" fill="#854f0b" text-anchor="middle">9 V</text>

<line x1="300" y1="140" x2="480" y2="140" stroke="#378add" stroke-width="2"/>
<line x1="300" y1="180" x2="480" y2="180" stroke="#378add" stroke-width="2"/>
<line x1="300" y1="220" x2="480" y2="220" stroke="#7f77dd" stroke-width="2"/>
<line x1="300" y1="260" x2="480" y2="260" stroke="#7f77dd" stroke-width="2"/>
<line x1="300" y1="300" x2="480" y2="300" stroke="#7f77dd" stroke-width="2"/>
<line x1="300" y1="350" x2="480" y2="350" stroke="#e24b4a" stroke-width="2"/>
<line x1="300" y1="390" x2="480" y2="390" stroke="#888780" stroke-width="2"/>
<line x1="100" y1="350" x2="150" y2="350" stroke="#e24b4a" stroke-width="2"/>
<line x1="100" y1="390" x2="150" y2="390" stroke="#888780" stroke-width="2"/>

<g font-size="12" fill="#2c2c2a">
<text x="290" y="144" text-anchor="end">GPIO 16 (RX2)</text>
<text x="290" y="184" text-anchor="end">GPIO 17 (TX2)</text>
<text x="290" y="224" text-anchor="end">GPIO 15</text>
<text x="290" y="264" text-anchor="end">GPIO 4</text>
<text x="290" y="304" text-anchor="end">GPIO 5</text>
<text x="290" y="354" text-anchor="end">3V3</text>
<text x="290" y="394" text-anchor="end">GND</text>
<text x="160" y="354">VIN</text>
<text x="160" y="394">GND</text>
<text x="490" y="144">TXD</text>
<text x="490" y="184">RXD</text>
<text x="490" y="224">AUX</text>
<text x="490" y="264">M0</text>
<text x="490" y="304">M1</text>
<text x="490" y="354">VCC</text>
<text x="490" y="394">GND</text>
<text x="90" y="354" text-anchor="end">+</text>
<text x="90" y="394" text-anchor="end">−</text>
</g>

<g font-size="12" fill="#2c2c2a">
<line x1="40" y1="460" x2="70" y2="460" stroke="#e24b4a" stroke-width="2"/>
<text x="78" y="464">Energia</text>
<line x1="150" y1="460" x2="180" y2="460" stroke="#378add" stroke-width="2"/>
<text x="188" y="464">Dados (serial)</text>
<line x1="300" y1="460" x2="330" y2="460" stroke="#7f77dd" stroke-width="2"/>
<text x="338" y="464">Controle do rádio</text>
<line x1="490" y1="460" x2="520" y2="460" stroke="#888780" stroke-width="2"/>
<text x="528" y="464">Terra (GND)</text>
</g>
</svg>
